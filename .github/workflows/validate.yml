name: Validate

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-audit:
    name: Cost Exposure Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cost exposure audit
        run: bash scripts/audit-cost-exposure.sh

  route-validation:
    name: Route Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate routes
        run: node scripts/validate-routes.js

      - name: Lint silent catches
        run: bash scripts/lint-silent-catches.sh

      # Ratchet (Task #1871): a query or write naming an attribute its model does
      # not declare fails only if its key is not in the baseline. Baseline entries
      # that no longer occur are printed as GONE and do not fail.
      - name: Schema agreement (step 1, query vs model)
        run: node scripts/check-schema-agreement.js --baseline scripts/schema-agreement.baseline

      # Ratchet (Task #1875): a model declaring a column, a paranoid deleted_at or
      # a table that no live migration creates fails only if its key is not in
      # the baseline; GONE entries are printed and do not fail. Migrations are
      # not production: this catches drift introduced in code against
      # src/migrations/, not drift between migrations and the live database
      # (scripts/check-pending-migrations.js, docs/MIGRATION_DRIFT_READ.md).
      - name: Schema agreement (step 2, model vs migrations)
        run: node scripts/check-schema-agreement.js --step2-baseline scripts/schema-agreement-step2.baseline

  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: episode_metadata_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "DROP DATABASE IF EXISTS episode_metadata_test;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE episode_metadata_test;"

      - name: Run database migrations
        run: npm run migrate:up
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/episode_metadata_test
          NODE_ENV: test

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/episode_metadata_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/episode_metadata_test
          JWT_SECRET: test-secret-key-minimum-32-characters-long
          NODE_ENV: test

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend Vitest suite
        run: npx vitest run
