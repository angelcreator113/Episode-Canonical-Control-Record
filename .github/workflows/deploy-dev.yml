name: Deploy to Development

# ═══════════════════════════════════════════════════════════════════════════
# REWRITE 2026-07-10 — F-Deploy-1 Fix Plan v1.30 §5 (rewrite gate) / FD-57.
# Replaces the shared-box SSH deploy reviewed in v1.30 §2 (R1–R6).
#
# DESIGN (deltas from the pre-rewrite file):
#   • Transport: SSM RunCommand (FD-57, zero-inbound). No runner→SSH. The
#     Security Group is untouched by deploys.
#   • Targeting: by instance tag (Name=episode-dev-backend). NO host secret
#     exists on this path — DEV_EC2_HOST is retired (deleted with this PR's
#     gate) and EPISODE_DEV_BACKEND_HOST is unreferenced. Exceeds the v1.30
#     §5 pt-1 spec ("retarget to EPISODE_DEV_BACKEND_HOST"): recorded as a
#     spec delta — no lever can point at the shared box because no lever
#     exists.
#   • Runner auth: GitHub OIDC → role episode-gha-deploy-dev. No static AWS
#     keys on this path (F-Deploy-G1-AD retirement, this path only).
#   • Secrets: this workflow carries ZERO application secrets, and since
#     2026-11-05 (Task #3716) the dev box holds no production database
#     credential either: the dev app runs against the box's LOCAL Postgres
#     (docs/runbooks/dev-environment.md). The box role can no longer read
#     episode-metadata/dev/database.
#   • On-box path (2026-11-05, Task #3716): the runner builds frontend/dist
#     only. The box runs scripts/dev-db/deploy-dev-box.sh from THIS commit:
#     stop the dev app; scripts/dev-db/install-dev-app.sh clones this sha,
#     npm ci, unpacks the runner's dist (sha256-checked), migrates the LOCAL
#     database, swaps trees; start; verify (:3002 on 127.0.0.1 only, /health
#     healthy + connected, an authenticated route refuses without a token);
#     pm2 save. A failed verify puts the previous tree back and restarts it.
#     The deploy never touches nginx: the dev app is local-only until dev
#     auth exists (runbook, "Reopening the dev app").
#     --only episode-api,episode-worker stays as config hygiene (RF-1).
#
# TRIGGER POSTURE:
#   • NO push trigger exists anywhere in this file — deliberate, per the
#     CauseClosed (2026-07-01) Sec 6 abort-precondition. Binary check
#     (expected EMPTY):
#       git show origin/main:.github/workflows/deploy-dev.yml | Select-String -Pattern "^\s*push:"
#   • workflow_dispatch retained as the gated human lever (parity with
#     deploy-production per F-Deploy-G1-S).
#   • The Actions-level runtime disable (disabled_manually, 2026-07-01) is
#     workflow-ID state and SURVIVES this file's merge. Merging this rewrite
#     RE-ENABLES NOTHING. Re-enablement remains its own Rule 7 gate per Fix
#     Plan v1.28 §5 / v1.30 §5 pt-5.
#
# PREREQUISITES BEFORE FIRST DISPATCH (none exist at authoring; all gated):
#   P1  Instance role gains SSM permissions (AmazonSSMManagedInstanceCore or
#       scoped inline); instance registered — verify:
#         aws ssm describe-instance-information (non-empty for the instance)
#   P2  GitHub OIDC provider + IAM role episode-gha-deploy-dev (trust scoped
#       to this repo + environment "development"); permissions: S3 Put/Get on
#       s3://episode-metadata-storage-dev/deploys/*, ssm:SendCommand scoped
#       to the instance ARN + AWS-RunShellScript, ssm:ListCommandInvocations,
#       ssm:GetCommandInvocation
#   P3, P4  RETIRED 2026-11-05 (Task #3716): the dev app no longer reads a
#       production secret; the box role's read of episode-metadata/dev/database
#       was removed. P3 now means: the box's local Postgres, swap (RAM + swap
#       >= 2800 MiB, else install-dev-app.sh refuses) and the files in
#       ~/.config/episode-dev/ exist (docs/runbooks/dev-environment.md).
#   P5  RETIRED 2026-11-05: the deploy no longer touches nginx. nginx is
#       stopped while the dev app is local-only.
# ═══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC federation — see header; no static AWS keys on this path

env:
  AWS_REGION: us-east-1
  DEPLOY_BUCKET: episode-metadata-storage-dev
  DEPLOY_PREFIX: deploys/dev
  INSTANCE_TAG: episode-dev-backend

jobs:
  # Has CI already passed the test suite for this exact commit? (Task #3790)
  # The Validate workflow runs on every push to main, and its "Tests" job runs
  # the same suite as the test job below, on the same Postgres. When that job
  # succeeded for this commit, the test job is skipped: it was most of a
  # 30-minute run. Anything else (no such run, still running, failed, a commit
  # that is not on main, or this lookup failing) means the tests run here.
  ci-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.lookup.outputs.passed }}
    steps:
      - name: Look for a successful Tests job on main for this commit
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          passed=false
          run_ids="$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&branch=main&event=push&per_page=100" \
            --jq '.workflow_runs[] | select(.path == ".github/workflows/validate.yml") | .id' || true)"
          for id in $run_ids; do
            conclusion="$(gh api "repos/${REPO}/actions/runs/${id}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "Tests")] | if length == 1 then .[0].conclusion else "" end' || true)"
            echo "Validate run ${id}: Tests job conclusion: ${conclusion:-none}"
            if [ "$conclusion" = "success" ]; then passed=true; fi
          done
          [ -n "$run_ids" ] || echo "No Validate push run on main for ${SHA}."
          echo "passed=${passed}" >> "$GITHUB_OUTPUT"
          if [ "$passed" = "true" ]; then
            echo "CI already passed Tests for \`${SHA}\` on main: the test job is skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No successful CI Tests job for \`${SHA}\` on main: the test job runs." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    needs: ci-tests
    # always(): the tests also run when the lookup job itself failed.
    if: ${{ always() && needs.ci-tests.outputs.passed != 'true' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: episode_metadata_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "DROP DATABASE IF EXISTS episode_metadata_test;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE episode_metadata_test;"

      - name: Run database migrations
        run: npm run migrate:up
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/episode_metadata_test
          NODE_ENV: test

      - name: Run tests
        run: npm test -- --coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/episode_metadata_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/episode_metadata_test
          JWT_SECRET: test-secret-key-minimum-32-characters-long
          NODE_ENV: test

  build:
    needs: [ci-tests, test]
    # Runs after the tests passed here, or after they were skipped because CI
    # had passed them. A failed or cancelled test job stops the deploy.
    if: ${{ !cancelled() && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.ci-tests.outputs.passed == 'true')) }}
    runs-on: ubuntu-latest
    outputs:
      dist_sha256: ${{ steps.pack.outputs.dist_sha256 }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Built here, never on the box: building on the 2 GB dev box hung it
      # (2026-11-05). The backend is installed on the box from this commit.
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          ls -lh dist/assets/ | tail -5

      - name: Pack frontend/dist and the on-box scripts
        id: pack
        run: |
          mkdir -p out
          tar -C frontend/dist -czf out/dist.tar.gz .
          cp scripts/dev-db/install-dev-app.sh scripts/dev-db/deploy-dev-box.sh out/
          ( cd out && sha256sum dist.tar.gz install-dev-app.sh deploy-dev-box.sh | tee SHA256SUMS )
          echo "dist_sha256=$(sha256sum out/dist.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "dist.tar.gz: $(du -h out/dist.tar.gz | cut -f1)"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: episode-metadata-dev-${{ github.sha }}
          path: out/
          retention-days: 3

  deploy:
    needs: build
    # Explicit, because a job downstream of a skipped job is skipped by default.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: development

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: episode-metadata-dev-${{ github.sha }}
          path: out

      - name: Verify the build's checksums
        run: cd out && sha256sum -c SHA256SUMS

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637423256673:role/episode-gha-deploy-dev
          aws-region: us-east-1

      - name: Preflight — SSM target Online
        id: preflight
        run: |
          INFO=$(aws ssm describe-instance-information \
            --filters "Key=tag:Name,Values=${INSTANCE_TAG}" \
            --query "InstanceInformationList[?PingStatus=='Online'].[InstanceId,PingStatus,PlatformName]" \
            --output text)
          if [ -z "$INFO" ]; then
            echo "::error title=SSM preflight failed::No Online SSM-managed instance with tag Name=${INSTANCE_TAG}."
            exit 1
          fi
          INSTANCE_ID=$(echo "$INFO" | head -1 | cut -f1)
          echo "✅ SSM target Online: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload to S3, presign
        id: s3
        run: |
          BASE="${DEPLOY_PREFIX}/${{ github.sha }}"
          for f in dist.tar.gz install-dev-app.sh deploy-dev-box.sh; do
            aws s3 cp "out/$f" "s3://${DEPLOY_BUCKET}/${BASE}/$f" --only-show-errors
          done
          # Presigned URLs are capability tokens (30 min TTL): masked.
          for k in dist:dist.tar.gz inst:install-dev-app.sh dep:deploy-dev-box.sh; do
            URL=$(aws s3 presign "s3://${DEPLOY_BUCKET}/${BASE}/${k#*:}" --expires-in 1800)
            echo "::add-mask::$URL"
            echo "${k%%:*}_url=$URL" >> "$GITHUB_OUTPUT"
          done
          cd out
          echo "inst_sha=$(sha256sum install-dev-app.sh | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "dep_sha=$(sha256sum deploy-dev-box.sh | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM RunCommand
        env:
          DIST_URL: ${{ steps.s3.outputs.dist_url }}
          INST_URL: ${{ steps.s3.outputs.inst_url }}
          DEP_URL: ${{ steps.s3.outputs.dep_url }}
          DIST_SHA: ${{ needs.build.outputs.dist_sha256 }}
          INST_SHA: ${{ steps.s3.outputs.inst_sha }}
          DEP_SHA: ${{ steps.s3.outputs.dep_sha }}
          INSTANCE_ID: ${{ steps.preflight.outputs.instance_id }}
          SHA: ${{ github.sha }}
        run: |
          # The box fetches three files, checks each sha256, and runs
          # deploy-dev-box.sh as root. No credentials cross.
          D="/home/ubuntu/dev-db/deploy-${SHA}"
          ONBOX="set -e
          install -d -m 700 '$D'
          curl -fsSL '$DIST_URL' -o '$D/dist.tar.gz'
          curl -fsSL '$INST_URL' -o '$D/install-dev-app.sh'
          curl -fsSL '$DEP_URL' -o '$D/deploy-dev-box.sh'
          printf '%s  %s\n' '$DIST_SHA' '$D/dist.tar.gz' '$INST_SHA' '$D/install-dev-app.sh' '$DEP_SHA' '$D/deploy-dev-box.sh' | sha256sum -c -
          chown -R ubuntu:ubuntu '$D'
          set +e
          REF='$SHA' DIST_TARBALL='$D/dist.tar.gz' DIST_SHA256='$DIST_SHA' INSTALLER='$D/install-dev-app.sh' bash '$D/deploy-dev-box.sh'
          rc=\$?
          rm -rf '$D'
          exit \$rc"
          PARAMS=$(python3 -c 'import json,sys; print(json.dumps({"commands":[sys.argv[1]],"executionTimeout":["1200"]}))' "$ONBOX")
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy-dev ${SHA}" \
            --timeout-seconds 900 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $COMMAND_ID"

          STATUS="Pending"
          for i in $(seq 1 80); do
            sleep 15
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "  [$i] $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          echo '─── On-box output (stdout) ───'
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          if [ "$STATUS" != "Success" ]; then
            echo '─── On-box stderr ───'
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            echo "::error title=Deploy failed::SSM command ended $STATUS"
            exit 1
          fi
          echo '✅ Deploy Success'

      - name: Cleanup S3 deploy objects
        if: always()
        run: |
          aws s3 rm "s3://${DEPLOY_BUCKET}/${DEPLOY_PREFIX}/${{ github.sha }}/" --recursive --only-show-errors || true

      - name: Deployment summary
        run: |
          echo "## Dev Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Transport: SSM RunCommand (zero-inbound); on-box: scripts/dev-db/deploy-dev-box.sh" >> $GITHUB_STEP_SUMMARY
          echo "- Database: the dev box's local Postgres (no production credential on the box)" >> $GITHUB_STEP_SUMMARY
          echo "- Exposure: dev API on 127.0.0.1 only; nginx not touched" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets carried by this workflow: NONE" >> $GITHUB_STEP_SUMMARY
