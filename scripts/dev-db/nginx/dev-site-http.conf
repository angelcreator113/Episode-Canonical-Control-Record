# dev.primepisodes.com, port 80 (dev box only). Installed by
# scripts/dev-db/setup-dev-nginx.sh. Port 80 does two things and nothing else:
# it answers the Let's Encrypt HTTP-01 challenge, and it redirects to HTTPS.
# Runbook: docs/runbooks/dev-environment.md ("The public dev site").

server {
    listen 80;
    listen [::]:80;
    server_name dev.primepisodes.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://dev.primepisodes.com$request_uri;
    }
}

# Any other Host header on port 80: close the connection.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}
