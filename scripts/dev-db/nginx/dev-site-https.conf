# dev.primepisodes.com, port 443 (dev box only). Installed by
# scripts/dev-db/setup-dev-nginx.sh once a certificate exists.
#
# nginx is the only public way in. It serves the built frontend from the
# app tree and proxies /api/ and /health to the app on IPv4 loopback. The app
# keeps listening on 127.0.0.1:3002 only. Nothing else the app answers
# (/uploads, /ping, /_diag/health, /admin/queues) is reachable through here.
# Runbook: docs/runbooks/dev-environment.md ("The public dev site").

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.primepisodes.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/dev.primepisodes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.primepisodes.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:devssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /home/ubuntu/episode-metadata/frontend/dist;
    index index.html;

    # Uploads go up to 500 MB (MAX_FILE_UPLOAD_SIZE_MB).
    client_max_body_size 500M;

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;   # server-sent events
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3002/health;
        proxy_set_header Host $host;
    }

    # Vite's content-hashed build files.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other path gets index.html, never cached.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}

# Any other Host header on port 443: refuse the TLS handshake.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/dev.primepisodes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.primepisodes.com/privkey.pem;
    return 444;
}
